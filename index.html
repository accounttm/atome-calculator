<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#ffffff">

<title>Atome Calculator | TrendMalayaa</title>

<style>
* {
    box-sizing: border-box;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
}

body {
    margin: 0;
    padding: 20px;
    background: #f4f5f7;
    color: #151515;
}

.container {
    width: 100%;
    max-width: 460px;
    margin: 30px auto;
}

.card {
    background: #ffffff;
    border-radius: 20px;
    padding: 26px;
    box-shadow: 0 6px 25px rgba(0,0,0,.08);
}

h1 {
    text-align: center;
    margin: 0;
    font-size: 26px;
    font-weight: 800;
}

.brand {
    text-align: center;
    color: #777;
    margin-top: 5px;
    margin-bottom: 30px;
    font-size: 14px;
}

label {
    font-size: 14px;
    font-weight: 700;
}

.input-wrap {
    display: flex;
    align-items: center;
    border: 2px solid #ddd;
    border-radius: 13px;
    margin-top: 9px;
    overflow: hidden;
}

.currency {
    background: #f3f3f3;
    padding: 16px;
    font-weight: 800;
    font-size: 18px;
}

input {
    width: 100%;
    border: 0;
    outline: 0;
    padding: 15px;
    font-size: 24px;
    font-weight: 800;
}

.breakdown {
    margin-top: 25px;
    background: #f7f7f8;
    border-radius: 15px;
    padding: 18px;
}

.row {
    display: flex;
    justify-content: space-between;
    gap: 15px;
    padding: 7px 0;
    font-size: 14px;
}

.line {
    border-top: 1px solid #ddd;
    margin: 12px 0;
}

.total {
    font-weight: 800;
    font-size: 15px;
}

.net {
    margin-top: 18px;
    background: #111;
    color: white;
    border-radius: 15px;
    padding: 21px 15px;
    text-align: center;
}

.net-label {
    font-size: 12px;
    opacity: .7;
    letter-spacing: 1px;
}

.net-amount {
    font-size: 34px;
    font-weight: 900;
    margin-top: 5px;
}

.effective {
    margin-top: 6px;
    font-size: 12px;
    opacity: .7;
}

.footer {
    text-align: center;
    color: #999;
    font-size: 11px;
    margin-top: 18px;
    line-height: 1.5;
}

@media(max-width:500px) {
    body {
        padding: 12px;
    }

    .container {
        margin: 15px auto;
    }

    .card {
        padding: 20px;
    }
}
</style>
</head>

<body>

<div class="container">
<div class="card">

<h1>ATOME CALCULATOR</h1>
<div class="brand">TrendMalayaa</div>

<label>Amount Customer Scan</label>

<div class="input-wrap">
    <div class="currency">RM</div>

    <input
        id="amount"
        type="number"
        inputmode="decimal"
        step="0.01"
        placeholder="0.00"
    >
</div>

<div class="breakdown">

    <div class="row">
        <span>MDR (6%)</span>
        <strong id="mdr">RM0.00</strong>
    </div>

    <div class="row">
        <span>SST MDR (8%)</span>
        <strong id="sstMdr">RM0.00</strong>
    </div>

    <div class="row">
        <span>Flat Fee</span>
        <strong id="flat">RM0.00</strong>
    </div>

    <div class="row">
        <span>SST Flat Fee</span>
        <strong id="flatSst">RM0.00</strong>
    </div>

    <div class="line"></div>

    <div class="row total">
        <span>TOTAL CHARGE</span>
        <span id="totalCharge">RM0.00</span>
    </div>

</div>

<div class="net">

    <div class="net-label">
        NET SETTLEMENT
    </div>

    <div class="net-amount" id="net">
        RM0.00
    </div>

    <div class="effective" id="effective">
        Effective Charge: 0.00%
    </div>

</div>

<div class="footer">
MDR 6% + SST 8% on fees + RM1.00 Flat Fee
<br>
TrendMalayaa
</div>

</div>
</div>


<script>

const amountInput = document.getElementById("amount");

function money(value) {
    return "RM" + value.toLocaleString("en-MY", {
        minimumFractionDigits: 2,
        maximumFractionDigits: 2
    });
}

function round2(value) {
    return Math.round((value + Number.EPSILON) * 100) / 100;
}

function calculate() {

    const amount = parseFloat(amountInput.value);

    if (!amount || amount <= 0) {

        document.getElementById("mdr").textContent = "RM0.00";
        document.getElementById("sstMdr").textContent = "RM0.00";
        document.getElementById("flat").textContent = "RM0.00";
        document.getElementById("flatSst").textContent = "RM0.00";
        document.getElementById("totalCharge").textContent = "RM0.00";
        document.getElementById("net").textContent = "RM0.00";
        document.getElementById("effective").textContent =
            "Effective Charge: 0.00%";

        return;
    }

    // MDR 6%
    const mdr = round2(amount * 0.06);

    // SST 8% on MDR
    const sstMdr = round2(mdr * 0.08);

    // Fixed fees
    const flatFee = 1.00;
    const flatSst = 0.08;

    // Total charges
    const totalCharge =
        round2(mdr + sstMdr + flatFee + flatSst);

    // Net settlement
    const net =
        round2(amount - totalCharge);

    // Effective %
    const effective =
        (totalCharge / amount) * 100;


    document.getElementById("mdr").textContent =
        money(mdr);

    document.getElementById("sstMdr").textContent =
        money(sstMdr);

    document.getElementById("flat").textContent =
        money(flatFee);

    document.getElementById("flatSst").textContent =
        money(flatSst);

    document.getElementById("totalCharge").textContent =
        money(totalCharge);

    document.getElementById("net").textContent =
        money(net);

    document.getElementById("effective").textContent =
        "Effective Charge: " +
        effective.toFixed(2) +
        "%";
}

amountInput.addEventListener("input", calculate);

</script>

</body>
</html>
